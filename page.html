<!DOCTYPE html>
<!-- המסגרת של עמודי התוכן. הטקסט עצמו יושב ב-content/<עמוד>/
     <שפה>.html, והבנייה מרכיבה את שניהם לכל צירוף — כתובת לכל
     שפה, והטקסט כבר בתוך הקובץ שנשלח. ההסבר המלא, וגם למה זה
     לא נשאר עמוד אחד לשתי שפות, יושב ב-build-site.js ליד
     CONTENT_PAGES.

     הקובץ הזה אינו נשלח כמו שהוא: הסימונים שבו מוחלפים בבנייה,
     ובנייה שלא מצאה סימון נעצרת. -->
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title></title>
<meta name="description" content="">
<!-- styles.css ראשון: הוא מגדיר את הטוקנים (צבעים, מרווחים,
     פינות) ש-landing.css משתמש בהם. בלעדיו כל var(--...)
     בעמוד ריק, והעמוד מוצג בשחור על לבן בלי שום עיצוב. -->
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/landing.css">
</head>
<body class="legal-body">
<!-- דילוג לתוכן: הקישור הראשון במסמך, נסתר עד שמקבל
     מיקוד. מי שגולש במקלדת אינו צריך לעבור על הלוגו,
     בורר השפה ועל חמש הלשוניות בכל עמוד. -->
<a class="skip-link" href="#main" data-i18n="landing.skipToContent">דילוג לתוכן הראשי</a>

<nav class="lp-nav">
  <div class="landing-wrap lp-nav-inner">

    <div class="lp-nav-spacer"></div>
    <!-- בורר השפה. האפשרויות נכתבות בזמן הבנייה, וכל אחת מהן
         היא הכתובת של אותו עמוד בשפה אחרת — ולא החלפת טקסטים
         במקום. כך הכתובת שבסרגל אומרת את מה שהעמוד מראה, ומי
         שמשתף את הקישור משתף את השפה שראה. -->
    <select id="page-language" class="lp-lang" data-i18n-aria-label="landing.language"
      aria-label="שפה"><!--LANGUAGE_OPTIONS--></select>
  </div>
<!-- לשוניות האתר. שורה שנייה ולא באותה שורה עם הלוגו:
     בעברית השמות ארוכים, ועם הלוגו ובורר השפה אין מקום לחמש
     לשוניות באף טלפון. -->
<div class="lp-tabs-wrap">

</html>
